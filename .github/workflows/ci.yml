name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Audit dependencies
        working-directory: app
        run: npm audit --audit-level=high

      - name: Scan secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      - name: Build Docker image
        run: docker build -t estudo-supabase ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: estudo-supabase:latest
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: docker tag estudo-supabase:latest ghcr.io/derickcarmelo0248/estudo-supabase:latest

      - name: Push Docker image
        run: docker push ghcr.io/derickcarmelo0248/estudo-supabase:latest

      - name: Check Node.js version
        run: node --version

      - name: Check project
        working-directory: app
        run: node --check index.js
