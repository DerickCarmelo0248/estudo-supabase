name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Audit dependencies
        working-directory: app
        run: npm audit --audit-level=high

      - name: Scan secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      - name: Generate image tag
        id: image
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="ghcr.io/$OWNER/estudo-supabase:${GITHUB_SHA}"

          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE_REF"

      - name: Build Docker image
        run: docker build -t "${{ steps.image.outputs.image_ref }}" ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.image_ref }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Run container
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          docker run -d \
            --name estudo-supabase-api \
            -p 3000:3000 \
            -e SUPABASE_URL \
            -e SUPABASE_KEY \
            "${{ steps.image.outputs.image_ref }}"

      - name: Wait for container health
        run: |
          for i in {1..10}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' estudo-supabase-api)
            echo "Health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker logs estudo-supabase-api
              exit 1
            fi

            sleep 5
          done

          docker logs estudo-supabase-api
          exit 1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push "${{ steps.image.outputs.image_ref }}"

      - name: Check Node.js version
        run: node --version

      - name: Check project
        working-directory: app
        run: node --check index.js

  deploy-dev:
    needs: test
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "${{ needs.test.outputs.image_ref }}"

      - name: Run DEV container
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APP_ENV: ${{ vars.APP_ENV }}
        run: |
          docker run -d \
            --name api-dev \
            -p 8080:3000 \
            -e SUPABASE_URL \
            -e SUPABASE_KEY \
            -e APP_ENV \
            "${{ needs.test.outputs.image_ref }}"

      - name: Wait for DEV health
        run: |
          for i in {1..12}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' api-dev)

            echo "DEV health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker logs api-dev
              exit 1
            fi

            sleep 5
          done

          docker logs api-dev
          exit 1

      - name: Validate DEV
        run: |
          curl --fail http://localhost:8080/health
          curl --fail http://localhost:8080/env

  deploy-uat:
    needs:
      - test
      - deploy-dev
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "${{ needs.test.outputs.image_ref }}"

      - name: Run UAT container
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APP_ENV: ${{ vars.APP_ENV }}
        run: |
          docker run -d \
            --name api-uat \
            -p 8081:3000 \
            -e SUPABASE_URL \
            -e SUPABASE_KEY \
            -e APP_ENV \
            "${{ needs.test.outputs.image_ref }}"

      - name: Wait for UAT health
        run: |
          for i in {1..12}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' api-uat)

            echo "UAT health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker logs api-uat
              exit 1
            fi

            sleep 5
          done

          docker logs api-uat
          exit 1

      - name: Validate UAT
        run: |
          curl --fail http://localhost:8081/health
          curl --fail http://localhost:8081/env
