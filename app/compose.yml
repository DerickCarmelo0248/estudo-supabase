services:
  api:
    build: .
    container_name: estudo-supabase-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: estudo-supabase-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
