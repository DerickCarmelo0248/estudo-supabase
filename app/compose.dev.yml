name: estudo-dev

services:
  api:
    image: estudo-supabase:${IMAGE_TAG:-latest}
    build: .
    container_name: estudo-supabase-api-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: estudo-supabase-nginx-dev
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    container_name: estudo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: estudo
      POSTGRES_PASSWORD: estudo_dev
      POSTGRES_DB: estudo
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudo -d estudo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
